<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TempleOS_Tribute</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
  
  * { 
    margin: 0; padding: 0; box-sizing: border-box; 
    -webkit-tap-highlight-color: transparent; 
    image-rendering: pixelated; 
  }
  
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0000AA; /* Classic TempleOS Blue */
    font-family: 'VT323', monospace;
    position: fixed; touch-action: none;
  }

  #container { 
    position: relative; 
    width: 100vw; 
    height: 100vh; 
    border: 10px solid #55FFFF; /* Cyan border */
    outline: 5px solid #000;
    outline-offset: -10px;
  }

  #bg-reveal {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 1;
    opacity: 0;
    transition: opacity 0.8s steps(5); 
  }

  canvas {
    position: absolute;
    top: 0; left: 0;
    z-index: 2;
    pointer-events: none;
  }

  #click-me {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 100;
    color: #000; 
    background: #AAAAAA; 
    border: 4px solid;
    border-color: #FFFFFF #555555 #555555 #FFFFFF;
    text-decoration: none;
    font-size: 32px;
    padding: 12px 24px; 
    cursor: pointer;
    user-select: none;
    box-shadow: 6px 6px 0px #000;
    text-transform: uppercase;
  }

  /* When the button "stops" running away */
  .catchable {
    background: #FFFF55 !important; /* Yellow */
    border-color: #000 !important;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="container">
  <img id="bg-reveal" src="YOUR_IMAGE_URL_HERE.jpg" alt="Final Reveal">
  <canvas id="glitch-canvas"></canvas>
  <a href="#" id="click-me">CLICK ME</a>
</div>

<script>
  const canvas = document.getElementById('glitch-canvas');
  const ctx = canvas.getContext('2d');
  const link = document.getElementById('click-me');
  const bg = document.getElementById('bg-reveal');
  
  const colors = ["#FFFFFF", "#FF5555", "#55FF55", "#FFFF55", "#5555FF", "#FF55FF", "#55FFFF"];
  const rareShoutouts = ["TERRY DAVIS", "GOD'S PROGRAMMER", "TEMPLE OS", "CIA GLOWS", "DIVINE INTELLECT"];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    ctx.fillStyle = "#0000AA";
    ctx.fillRect(0,0, canvas.width, canvas.height);
  }
  window.addEventListener('resize', resize);
  resize();

  function drawChaos(x, y) {
    for (let i = 0; i < 10; i++) {
      setTimeout(() => {
        // 1 in 50 chance for a Terry Davis shoutout
        const isRare = Math.random() < 0.02; 
        
        ctx.font = isRare ? "bold 30px 'VT323'" : "24px 'VT323'";
        ctx.fillStyle = isRare ? "#FFFFFF" : colors[Math.floor(Math.random() * colors.length)];
        
        const text = isRare 
          ? rareShoutouts[Math.floor(Math.random() * rareShoutouts.length)] 
          : "RANDOM";
        
        const offX = (Math.random() - 0.5) * 220;
        const offY = (Math.random() - 0.5) * 220;
        
        ctx.fillText(text, x + offX, y + offY);
        
        // Draw some random system-style rectangles
        if (Math.random() > 0.6) {
          ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
          ctx.fillRect(x + offX, y + offY + 5, Math.random() * 80, 4);
        }
      }, i * 35);
    }
  }

  function handleInteraction(e) {
    const rect = link.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    const dist = Math.hypot(clientX - centerX, clientY - centerY);

    // 15% chance to stay put
    const isLucky = Math.random() > 0.85;

    if (dist < 130) {
      if (!isLucky) {
        link.classList.remove('catchable');
        drawChaos(clientX, clientY);
        const newX = Math.random() * (window.innerWidth - rect.width - 100) + 50;
        const newY = Math.random() * (window.innerHeight - rect.height - 100) + 50;
        link.style.left = `${newX}px`;
        link.style.top = `${newY}px`;
        link.style.transform = 'none';
        if (e.cancelable) e.preventDefault();
      } else {
        // The button "gives up" - visual cue for the user
        link.classList.add('catchable');
      }
    }
  }

  function revealBackground(e) {
    e.preventDefault();
    // Only allow reveal if the button is currently "catchable"
    if (link.classList.contains('catchable')) {
      canvas.style.display = 'none';
      link.classList.add('hidden');
      bg.style.opacity = '1';
    }
  }

  document.addEventListener('mousemove', handleInteraction);
  link.addEventListener('touchstart', handleInteraction, {passive: false});
  link.addEventListener('click', revealBackground);
</script>
</body>
</html>
