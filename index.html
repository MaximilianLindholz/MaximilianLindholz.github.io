<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chaos Random</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap');
  
  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
    -webkit-tap-highlight-color: transparent; 
  }
  
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000; 
    font-family: 'Courier Prime', 'Courier New', monospace;
    position: fixed; 
    touch-action: none; /* Prevents mobile scrolling/zooming */
  }

  #container {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  canvas {
    position: absolute;
    top: 0;
    left: 0;
    display: block;
    z-index: 1;
  }

  #publications-link {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 100;
    color: #00ff41; 
    text-decoration: none;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    padding: 50px; /* Large hit area */
    cursor: pointer;
    text-shadow: 2px 2px #ff00ff, -2px -2px #00ffff;
    user-select: none;
  }
</style>
</head>
<body>

<div id="container">
  <canvas id="glitch-canvas"></canvas>
  <a href="#" id="publications-link">Publications</a>
</div>

<script>
  const canvas = document.getElementById('glitch-canvas');
  const ctx = canvas.getContext('2d');
  const link = document.getElementById('publications-link');
  
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function drawChaos(x, y) {
    const iterations = 12; // How many "RANDOM"s drop per touch
    const colors = ["#00ff41", "#ff00ff", "#00ff41", "#ff00ff", "#ffffff"]; // Green, Pink, Green, Pink, White
    
    for (let i = 0; i < iterations; i++) {
      setTimeout(() => {
        const fontSize = Math.floor(Math.random() * 30) + 10;
        ctx.font = `bold ${fontSize}px "Courier Prime"`;
        
        // Pick a random color from our mix
        ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
        
        // Offset the text so it clusters around the touch point
        const offX = (Math.random() - 0.5) * 180;
        const offY = (Math.random() - 0.5) * 180;
        
        // Draw "RANDOM"
        ctx.fillText("RANDOM", x + offX, y + offY);
        
        // Add random horizontal glitch lines
        if (Math.random() > 0.7) {
          ctx.fillRect(x + offX, y + offY, Math.random() * 100, 1);
        }
      }, i * 20); // Creates a slight "stutter" timing effect
    }
  }

  function handleInteraction(e) {
    const rect = link.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    const dist = Math.hypot(clientX - centerX, clientY - centerY);

    // If near the button or clicking it
    if (dist < 120 || e.type === 'touchstart') {
      drawChaos(clientX, clientY);

      // Teleport
      const newX = Math.random() * (window.innerWidth - rect.width - 60) + 30;
      const newY = Math.random() * (window.innerHeight - rect.height - 60) + 30;

      link.style.left = `${newX}px`;
      link.style.top = `${newY}px`;
      link.style.transform = 'none';
      
      if (e.cancelable) e.preventDefault();
    }
  }

  // Listeners
  document.addEventListener('mousemove', handleInteraction);
  link.addEventListener('touchstart', handleInteraction, {passive: false});
  link.addEventListener('click', (e) => e.preventDefault());

</script>
</body>
</html>
