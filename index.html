<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SARDINE_OS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
  
  * { 
    margin: 0; padding: 0; box-sizing: border-box; 
    -webkit-tap-highlight-color: transparent; 
    image-rendering: pixelated; 
  }
  
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0000AA; /* TempleOS Blue */
    font-family: 'VT323', monospace;
    position: fixed; touch-action: none;
  }

  #container { 
    position: relative; 
    width: 100vw; 
    height: 100vh; 
    border: 10px solid #55FFFF; 
    outline: 5px solid #000;
    outline-offset: -10px;
  }

  #bg-reveal {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 1;
    opacity: 0;
    transition: opacity 0.5s steps(3); 
  }

  canvas {
    position: absolute;
    top: 0; left: 0;
    z-index: 2;
    pointer-events: none;
  }

  #click-me {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 100;
    color: #000; 
    background: #AAAAAA; 
    border: 4px solid;
    border-color: #FFFFFF #555555 #555555 #FFFFFF;
    text-decoration: none;
    font-size: 28px;
    padding: 10px 20px; 
    cursor: pointer;
    user-select: none;
    box-shadow: 6px 6px 0px #000;
  }

  .catchable {
    background: #FFFF55 !important;
    color: #FF5555 !important;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="container">
  <img id="bg-reveal" src="YOUR_IMAGE_URL_HERE.jpg" alt="Reveal">
  <canvas id="glitch-canvas"></canvas>
  <a href="#" id="click-me">CLICK ME</a>
</div>

<script>
  const canvas = document.getElementById('glitch-canvas');
  const ctx = canvas.getContext('2d');
  const link = document.getElementById('click-me');
  const bg = document.getElementById('bg-reveal');
  
  const colors = ["#FFFFFF", "#FF5555", "#55FF55", "#FFFF55", "#AAAAAA", "#55FFFF"];
  
  // Low-poly ASCII Sardine Variations
  const sardines = [
    "<'(((><", 
    " <º))))><", 
    "  ><(((º>", 
    " ───O))><",
    " <*)))><"
  ];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    ctx.fillStyle = "#0000AA";
    ctx.fillRect(0,0, canvas.width, canvas.height);
  }
  window.addEventListener('resize', resize);
  resize();

  function spawnSardine(x, y) {
    const amount = 5; 
    for (let i = 0; i < amount; i++) {
      // Pick a random sardine shape and color
      const fish = sardines[Math.floor(Math.random() * sardines.length)];
      const color = colors[Math.floor(Math.random() * colors.length)];
      
      const offX = (Math.random() - 0.5) * 150;
      const offY = (Math.random() - 0.5) * 150;
      
      ctx.font = `${Math.floor(Math.random() * 10 + 20)}px 'VT323'`;
      ctx.fillStyle = color;
      
      // Draw the sardine
      ctx.fillText(fish, x + offX, y + offY);
      
      // Rare Terry Davis Shoutout (1 in 30 fish)
      if (Math.random() < 0.03) {
        ctx.fillStyle = "#FFFFFF";
        ctx.fillText("TERRY DAVIS", x + offX, y + offY - 20);
      }
    }
  }

  function handleInteraction(e) {
    const rect = link.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    const dist = Math.hypot(clientX - centerX, clientY - centerY);

    const isLucky = Math.random() > 0.88; // ~12% chance to be catchable

    if (dist < 120) {
      if (!isLucky) {
        link.classList.remove('catchable');
        spawnSardine(clientX, clientY);
        
        const newX = Math.random() * (window.innerWidth - rect.width - 100) + 50;
        const newY = Math.random() * (window.innerHeight - rect.height - 100) + 50;
        
        link.style.left = `${newX}px`;
        link.style.top = `${newY}px`;
        link.style.transform = 'none';
        
        if (e.cancelable) e.preventDefault();
      } else {
        link.classList.add('catchable');
      }
    }
  }

  function reveal(e) {
    e.preventDefault();
    if (link.classList.contains('catchable')) {
      canvas.style.display = 'none';
      link.classList.add('hidden');
      bg.style.opacity = '1';
    }
  }

  document.addEventListener('mousemove', handleInteraction);
  link.addEventListener('touchstart', handleInteraction, {passive: false});
  link.addEventListener('click', reveal);
</script>
</body>
</html>
