<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VOID</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap');
  
  * { 
    margin: 0; padding: 0; box-sizing: border-box; 
    -webkit-tap-highlight-color: transparent; 
  }
  
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; /* Solid Black */
    font-family: 'Courier Prime', monospace;
    position: fixed; touch-action: none;
  }

  #container { 
    position: relative; 
    width: 100vw; height: 100vh; 
  }

  #butt-logo-reveal {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
    color: #FFFFFF;
    font-size: 50px;
    opacity: 0;
    transition: opacity 0.5s ease-in;
    user-select: none;
  }

  canvas {
    position: absolute;
    top: 0; left: 0;
    z-index: 2;
    pointer-events: none;
  }

  #click-me {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 100;
    color: #fff; 
    background: transparent; 
    border: 1px solid #fff;
    text-decoration: none;
    font-size: 20px;
    letter-spacing: 2px;
    padding: 15px 25px; 
    cursor: pointer;
    user-select: none;
    transition: background 0.2s;
  }

  /* When the button "stops" and becomes clickable */
  .catchable {
    background: #fff !important;
    color: #000 !important;
  }

  .hidden { display: none !important; }
  .revealed { opacity: 1 !important; }
</style>
</head>
<body>

<div id="container">
  <div id="butt-logo-reveal">( )( )</div>
  <canvas id="glitch-canvas"></canvas>
  <a href="#" id="click-me">CLICK ME</a>
</div>

<script>
  const canvas = document.getElementById('glitch-canvas');
  const ctx = canvas.getContext('2d');
  const link = document.getElementById('click-me');
  const logo = document.getElementById('butt-logo-reveal');
  
  // High contrast glitch colors
  const colors = ["#00ff41", "#ff00ff", "#ffffff", "#00ffff"];
  
  const icons = [
    "<'(((>< ( )", 
    " ><(((º> ( )", 
    " <*)))><",
    " [BUTT]",
    " >S/R_D<",
    " O::::O"
  ];

  let isRevealed = false;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener('resize', resize);
  resize();

  function spawnChaos(x, y) {
    if (isRevealed) return;

    if (Math.random() < 0.02) {
        ctx.font = "bold 24px 'Courier Prime'";
        ctx.fillStyle = "#FFFFFF";
        ctx.fillText("well this sucks...", x - 60, y);
    } else {
        for (let i = 0; i < 5; i++) {
            const icon = icons[Math.floor(Math.random() * icons.length)];
            const color = colors[Math.floor(Math.random() * colors.length)];
            const offX = (Math.random() - 0.5) * 180;
            const offY = (Math.random() - 0.5) * 180;
            
            ctx.font = `${Math.floor(Math.random() * 8 + 18)}px 'Courier Prime'`;
            ctx.fillStyle = color;
            ctx.fillText(icon, x + offX, y + offY);
            
            if (Math.random() > 0.8) {
                ctx.fillStyle = color;
                ctx.fillRect(x + offX, y + offY + 5, Math.random() * 40, 1);
            }
        }
    }
  }

  function handleInteraction(e) {
    if (isRevealed) return;

    const rect = link.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    const dist = Math.hypot(clientX - centerX, clientY - centerY);

    // 15% chance to be catchable
    const isLucky = Math.random() > 0.85;

    if (dist < 100) {
      if (!isLucky && !link.classList.contains('catchable')) {
        spawnChaos(clientX, clientY);
        const newX = Math.random() * (window.innerWidth - rect.width - 60) + 30;
        const newY = Math.random() * (window.innerHeight - rect.height - 60) + 30;
        link.style.left = `${newX}px`;
        link.style.top = `${newY}px`;
        link.style.transform = 'none';
        if (e.cancelable) e.preventDefault();
      } else {
        link.classList.add('catchable');
      }
    }
  }

  function revealFinal(e) {
    e.preventDefault();
    if (link.classList.contains('catchable')) {
      isRevealed = true;
      canvas.style.opacity = '0';
      link.classList.add('hidden');
      logo.classList.add('revealed');
    }
  }

  document.addEventListener('mousemove', handleInteraction);
  link.addEventListener('touchstart', handleInteraction, {passive: false});
  link.addEventListener('click', revealFinal);
</script>
</body>
</html>
