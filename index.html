<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Homepage</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap');
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background: #000;
    font-family: 'Courier Prime', 'Courier New', monospace;
  }

  #container {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  #bg-image {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }

  #publications-link {
    position: absolute;
    /* Initial Position */
    top: 10%;
    left: 50%;
    transform: translate(-50%, -50%);
    
    z-index: 10;
    color: #ff2020;
    text-decoration: none;
    font-size: clamp(14px, 2.5vw, 22px);
    font-weight: 700;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    white-space: nowrap;
    
    /* Smooth movement transition */
    transition: all 0.1s ease-out;
    padding: 20px; /* Larger hit area for the script to detect */
  }
</style>
</head>
<body>

<div id="container">
  <img id="bg-image" src="your-image-source.jpg">
  <a href="#" id="publications-link">Publications</a>
</div>

<script>
  const link = document.getElementById('publications-link');
  const buffer = 100; // How close the mouse gets before the link moves (in pixels)

  document.addEventListener('mousemove', (e) => {
    const rect = link.getBoundingClientRect();
    
    // Calculate center of the link
    const linkCenterX = rect.left + rect.width / 2;
    const linkCenterY = rect.top + rect.height / 2;

    // Calculate distance between mouse and center of link
    const distanceX = Math.abs(e.clientX - linkCenterX);
    const distanceY = Math.abs(e.clientY - linkCenterY);

    // If mouse is within the buffer zone
    if (distanceX < buffer && distanceY < buffer) {
      // Generate random new coordinates within the screen bounds
      const newX = Math.random() * (window.innerWidth - rect.width);
      const newY = Math.random() * (window.innerHeight - rect.height);

      // Apply new position
      link.style.left = `${newX}px`;
      link.style.top = `${newY}px`;
      link.style.transform = 'none'; // Remove the initial translate(-50%)
    }
  });
</script>

</body>
</html>
